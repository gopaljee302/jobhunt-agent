# jobhunt configuration. Everything tunable lives here — no editing Python.
#
# Tune `filters` first. It is deterministic, free, and it is what keeps the
# LLM bill small: roughly 2000 raw postings -> 40 candidates before a single
# token is spent.

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
include_titles:

    # Core backend/software roles — strongest match
    - '\b(software|backend|back-end|server|platform)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(backend|back-end|platform)\b'
    - '\bsoftware development engineer\b'
    - '\bsoftware engineer\b'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,3}|[123])\b'

    # AI / GenAI roles — highest priority for your profile
    - '\b(ai|artificial intelligence)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(ai|artificial intelligence)\b'
    - '\b(genai|gen\s*ai|generative ai)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(genai|gen\s*ai|generative ai)\b'
    - '\b(ai|genai|generative ai)\b.*\b(application|applications)\b'
    - '\bai application engineer\b'
    - '\bai software engineer\b'

    # LLM / Agentic AI roles
    - '\b(llm|large language model)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(llm|large language model)\b'
    - '\b(agentic ai|ai agent|ai agents|agent)\b.*\b(engineer|developer)\b'
    - '\bengineer\b.*\b(agentic ai|ai agent|ai agents)\b'

    # RAG / NLP / AI application engineering
    - '\b(rag|retrieval augmented generation)\b.*\b(engineer|developer)\b'
    - '\b(nlp|natural language processing)\b.*\b(engineer|developer)\b'
    - '\b(machine learning|ml)\b.*\bengineer\b'

    # API / cloud / platform backend roles
    - '\b(api|cloud|platform)\b.*\bengineer\b'
    - '\bengineer\b.*\b(api|cloud|platform)\b'

    # Reliability / production engineering
    - '\bsite reliability engineer\b'
    - '\bsre\b'

    # General technical roles that can overlap with your backend/AI profile
    - '\bmember of technical staff\b'
    - '\bpython\b.*\bengineer\b'
    - '\bengineer\b.*\bpython\b'

     # Research-heavy roles that don't align with your current resume
    - '\b(data scientist|machine learning scientist|research scientist)\b'

     # Internship / training roles — resume currently targets full-time
    - '\b(intern|internship|apprentice|trainee)\b'




  # Anything matching these is dropped even if an include matched.
exclude_titles:

    # Too senior for your current experience level
    - '\b(staff|principal|distinguished|fellow|architect)\b'
    - '\bsenior\b'
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'


    # Non-engineering business roles
    - '\b(sales|account executive|marketing|recruit|support|success)\b'

    # Wrong engineering disciplines
    - '\b(frontend|front-end|ios|android|mobile|game|designer)\b'

    # Data roles without a strong software/AI engineering component
    - '\b(data analyst|business analyst|data engineer)\b'

    # QA/testing-focused roles
    - '\b(qa|quality assurance|test engineer|testing engineer)\b'


  # Your resume targets India-based / remote opportunities.
locations:
    - bangalore
    - bengaluru
    - india

  # Keep remote opportunities
allow_remote: true

  # Recent postings are preferable
max_age_days: 30


# --- LLM stages -------------------------------------------------------------
screen_batch_size: 8
screen_jd_chars: 1400
draft_jd_chars: 6000

# Your current profile is junior / early-career.
# 7.0 keeps reasonably strong matches while allowing AI/backend roles
# whose title may not perfectly reflect your experience.
score_threshold: 7.0

max_per_digest: 5

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv